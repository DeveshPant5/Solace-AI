# Render Blueprint: deploys the Solace API and a free Postgres database.
#   Render dashboard -> New -> Blueprint -> connect this GitHub repo -> Apply.
# It asks for GROQ_API_KEY (free at console.groq.com) and, optionally,
# ELEVENLABS_API_KEY for Pip's voice. JWT_SECRET is generated for you.
#
# Free plan notes: the API sleeps after 15 minutes without requests (the first
# request after that takes up to a minute), and Render's free Postgres expires
# 30 days after it's created. For a database that doesn't expire, create one on
# Neon (free) and replace DATABASE_URL with its connection string.
services:
  - type: web
    name: solace-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render puts three proxy hops in front of the app (checked with GET /health/ip on
      # 2026-11-09: three X-Forwarded-For entries per request). Counting three from the
      # right gives the real client address, and a client can't fake it.
      - key: TRUST_PROXY
        value: "3"
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: solace-db
          property: connectionString

databases:
  - name: solace-db
    plan: free
    region: singapore
    databaseName: solace
    user: solace
    postgresMajorVersion: "16"
